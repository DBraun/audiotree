[metadata]
name = audiotree
version = attr: audiotree.__version__
url = https://github.com/DBraun/audiotree
author = David Braun
author_email = braun@ccrma.stanford.edu
description = Audio as an ML-framework-agnostic pytree, with JAX data loading and augmentations
long_description = file: README.md
long_description_content_type = "text/markdown"
classifiers =
    Intended Audience :: Developers
    Natural Language :: English
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Multimedia :: Sound/Audio
    Topic :: Software Development :: Libraries

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires =
    bagz>=0.2.0
    einops>=0.8.1
    grain>=0.2.15
    jaxloudnorm>=0.3.0
    librosa>=0.10.1
    librosax>=0.1.2
    loudness>=0.2.0
    numpy>=1.24
    soundfile>=0.12.1

[options.packages.find]
where = src

[options.extras_require]
dev =
    argbind @ git+https://github.com/DBraun/argbind.git@dev
    myst-parser
    pre-commit
    pytest
    pytest-cov
