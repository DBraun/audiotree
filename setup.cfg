[metadata]
name = audiotree
version = attr: audiotree.__version__
url = https://github.com/DBraun/audiotree
author = David Braun
author_email = braun@ccrma.stanford.edu
description = Audio data loading and augmentations in JAX
long_description = file: README.md
long_description_content_type = "text/markdown"
classifiers =
    Intended Audience :: Developers
    Natural Language :: English
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Multimedia :: Sound/Audio
    Topic :: Software Development :: Libraries

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires =
    einops>=0.8.1
    grain>=0.2.15
;    jax-ai-stack>=2025.2.5
    jaxloudnorm>=0.3.0
    librosa>=0.10.1
    librosax
    loudness
    numpy
    soundfile

[options.packages.find]
where = src

[options.extras_require]
dev =
    argbind @ git+https://github.com/DBraun/argbind.git@improve.subclasses
    myst-parser
    pytest
    pytest-cov
