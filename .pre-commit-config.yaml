# See https://pre-commit.com for usage. Install the git hook with:
#     pre-commit install
# Run against every file (e.g. when first adopting):
#     pre-commit run --all-files
# Committed format-compatibility fixtures. They exist to prove the on-disk
# layout has not changed, so no hook may rewrite them.
exclude: ^tests/assets/golden/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        # .gitattributes mandates CRLF for Windows batch scripts, so normalizing
        # them to LF here would make this hook and git fight on every run.
        exclude: \.bat$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Lint, auto-fixing what is safe to fix.
      - id: ruff
        args: [--fix]
      # Format (Black-compatible).
      - id: ruff-format
