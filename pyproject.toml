[project]
name = "audiotree"
dynamic = ["version", "dependencies", "optional-dependencies"]
authors = [
  { name="David Braun", email="braun@ccrma.stanford.edu" },
]
description = "Audio data loading and augmentations in JAX"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

keywords = [
    "audio",
    "machine learning",
]

[project.urls]
Homepage = "https://github.com/DBraun/audiotree"
Issues = "https://github.com/DBraun/audiotree/issues"

[tool.setuptools.dynamic]
version = {attr = "audiotree.__version__"}

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*aifc.*:DeprecationWarning:audioread.rawread",
    "ignore:.*audioop.*:DeprecationWarning:audioread.rawread",
    "ignore:.*sunau.*:DeprecationWarning:audioread.rawread",
]

[tool.ruff]
line-length = 88
target-version = "py311"
