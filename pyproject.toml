[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "audiotree"
dynamic = ["version"]
description = "Audio as an ML-framework-agnostic pytree, with JAX data loading and augmentations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
  { name = "David Braun", email = "braun@ccrma.stanford.edu" },
]
keywords = [
    "audio",
    "machine learning",
]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # bagz ships no macOS wheels; the reader is Linux-only.
    "bagz>=0.2.0; sys_platform == 'linux'",
    "einops>=0.8.1",
    "grain>=0.2.15",
    "jaxloudnorm>=0.3.1",
    "librosa>=0.10.1",
    "librosax>=0.1.2",
    "loudness>=0.2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12.1",
]

[project.urls]
Homepage = "https://github.com/DBraun/audiotree"
Issues = "https://github.com/DBraun/audiotree/issues"

[dependency-groups]
dev = [
    "argbind-dbraun",
    "furo",
    "myst-parser",
    "pre-commit",
    "pytest",
    "pytest-cov",
]

[tool.setuptools.dynamic]
version = { attr = "audiotree.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Run docstring examples (``>>> ...``) alongside the unit tests so they can't
# rot. ``testpaths`` lets a bare ``pytest`` collect all three: doctests from
# ``src``, the unit suite from ``tests``, and the ``examples`` scripts. The
# examples are a user's first contact with the library; leaving them out of the
# default run let all three rot against renamed API without anything going red.
addopts = "--doctest-modules"
testpaths = ["src", "tests", "examples"]
filterwarnings = [
    "ignore:.*aifc.*:DeprecationWarning:audioread.rawread",
    "ignore:.*audioop.*:DeprecationWarning:audioread.rawread",
    "ignore:.*sunau.*:DeprecationWarning:audioread.rawread",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Keep Ruff's defaults (E, F) and additionally reject PEP 484 implicit `Optional`
# (a `None` default on a non-`Optional`-typed parameter), e.g., `x: float = None`.
extend-select = ["RUF013"]
