[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "audiotree"
dynamic = ["version"]
description = "Audio as an ML-framework-agnostic pytree, with JAX data loading and augmentations"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "David Braun", email = "braun@ccrma.stanford.edu" },
]
keywords = [
    "audio",
    "machine learning",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "bagz>=0.2.0",
    "einops>=0.8.1",
    "grain>=0.2.15",
    "jaxloudnorm>=0.3.1",
    "librosa>=0.10.1",
    "librosax>=0.1.2",
    "loudness>=0.2.0",
    "numpy>=1.24",
    "soundfile>=0.12.1",
]

[project.urls]
Homepage = "https://github.com/DBraun/audiotree"
Issues = "https://github.com/DBraun/audiotree/issues"

# Dev dependencies live in a PEP 735 group (not [project.optional-dependencies]),
# so they stay out of the published wheel metadata. That matters because argbind
# is sourced from a git branch (below): a direct URL in published metadata would
# be rejected by PyPI. uv installs this group by default on `uv sync`.
[dependency-groups]
dev = [
    "argbind",
    "furo",
    "myst-parser",
    "pre-commit",
    "pytest",
    "pytest-cov",
]

# uv-only: resolve argbind from the fork's dev branch during development. Not part
# of the build, so the published package just sees a normal `argbind` requirement
# (and only if a consumer opts into it — it is not a runtime dependency).
[tool.uv.sources]
argbind = { git = "https://github.com/DBraun/argbind.git", branch = "dev" }

[tool.setuptools.dynamic]
version = { attr = "audiotree.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Run docstring examples (``>>> ...``) alongside the unit tests so they can't
# rot. ``testpaths`` lets a bare ``pytest`` collect both: doctests from ``src``
# and the unit suite from ``tests``.
addopts = "--doctest-modules"
testpaths = ["src", "tests"]
filterwarnings = [
    "ignore:.*aifc.*:DeprecationWarning:audioread.rawread",
    "ignore:.*audioop.*:DeprecationWarning:audioread.rawread",
    "ignore:.*sunau.*:DeprecationWarning:audioread.rawread",
]

[tool.ruff]
line-length = 88
target-version = "py311"
