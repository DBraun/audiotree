# Hatchling rather than setuptools because the sdist's file list is a release
# decision that belongs in this file. setuptools has no pyproject.toml knob for
# it -- its sdist silently globs `tests/test*.py`, which shipped 8 of the 28
# test modules with no `conftest.py` and no `tests/assets/`, i.e. a suite that
# could only fail. Hatchling's `[tool.hatch.build.targets.sdist]` states the
# policy explicitly. `hatchling>=1.27` is the floor for PEP 639
# `license`/`license-files`.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "audiotree"
dynamic = ["version"]
description = "Audio as a JAX pytree: a batched AudioTree container, Grain data sources, and dual NumPy/JAX augmentations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
  { name = "David Braun", email = "braun@ccrma.stanford.edu" },
]
keywords = [
    "audio",
    "machine learning",
]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # `absl`, `flax` and `jax` are imported at module scope by audiotree.core and
    # friends. They used to arrive only transitively via jaxloudnorm/librosax,
    # which made `import audiotree` depend on another package's dependency
    # choices; declare them.
    # Every floor below is the oldest version the graph actually admits,
    # verified with `uv pip install --resolution lowest-direct` and exercised by
    # the `test_lowest_direct` CI job. Declaring a lower one is fiction: the
    # resolver can never pick it.
    "absl-py>=2.0",
    # Imported directly by sources/core.py to name the exception librosa's
    # fallback decoder raises. It arrives transitively via librosa, but a
    # direct import needs a direct declaration.
    "audioread>=3.0",
    "einops>=0.8.1",
    "flax>=0.12.3",  # earlier 0.12.x break against every jax we allow
    # Upper-bounded on principle: grain is 0.x, so a minor release may break
    # us. Nothing here rides its private API any more -- the one class that did
    # (transforms.Batch) is gone -- so this can be relaxed once grain is 1.x.
    "grain>=0.2.15,<0.3",
    "jax>=0.10.0",  # funless `@jax.jit(...)`, which flax.nnx.jit also requires
    "jaxloudnorm>=0.3.2",
    "librosa>=0.11.0",
    "librosax>=0.1.2",
    "loudness>=0.2.0",
    "numpy>=2.1.3",
    "scipy>=1.16.2",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
# bagz publishes manylinux x86-64 wheels only (no macOS, no Linux aarch64, and
# nothing for Python 3.14), so a hard dependency made `pip install audiotree`
# unsatisfiable on platforms this package otherwise supports. It is imported
# lazily via `audiotree._bagz.require_bagz`, and is needed only for string
# leaves in TreeWriter/TreeDataSource and for the windowed-LUFS cache.
bagz = ["bagz>=0.2.0"]
# `tqdm` is imported lazily by AudioWriter when `show_progress=True`. It was
# imported but declared nowhere, so the flag was a silent no-op in every
# environment that had not installed tqdm for some other reason.
progress = ["tqdm>=4.66"]
# `all` deliberately does *not* pull the `bagz` extra verbatim: `pip install
# audiotree[bagz]` is an explicit request that should fail loudly where bagz has
# no wheel, but `[all]` is a convenience and must stay installable everywhere.
# Hence the same requirement under the markers describing where bagz publishes.
all = [
    "audiotree[progress]",
    "bagz>=0.2.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.14'",
]

[project.urls]
Homepage = "https://github.com/DBraun/audiotree"
Issues = "https://github.com/DBraun/audiotree/issues"

[dependency-groups]
# Floors here matter as much as the runtime ones: the `test_lowest_direct` CI
# job resolves every direct dependency to its lowest allowed version, and an
# unpinned tool resolves to something ancient that cannot even build.
dev = [
    "argbind-dbraun>=0.6.0",
    # Docs. `docs/Makefile` shells out to `sphinx-build`, so Sphinx itself has to
    # be declared -- it used to arrive only as a transitive dependency of furo.
    # The floor is 8.1: that is the release that substitutes the build year for
    # `%Y` in `conf.py`'s `copyright`, and 7.4.7 (which the old floors admitted)
    # renders the literal `%Y` in every page footer.
    "sphinx>=8.1",
    "furo>=2024.8.6",  # earlier releases cap sphinx below 8
    "myst-parser>=4.0",  # earlier releases cap sphinx below 8
    "pre-commit>=3.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # So `show_progress=True` is actually exercised in this repo's own venv
    # rather than silently doing nothing.
    "tqdm>=4.66",
]

[tool.hatch.version]
path = "src/audiotree/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/audiotree"]

# Policy: the sdist ships **no tests**. Running them needs `tests/conftest.py`,
# the `tests/{sources,datasources,transforms}` subpackages and 3.7 MB of audio
# under `tests/assets/` -- and those assets are carved out of the MIT grant (the
# MUSDB18-HQ excerpt is CC BY-NC-SA 4.0), so shipping them would make the sdist
# something a downstream redistributor cannot ship commercially. The suite lives
# in the git repository, where it is complete and runnable; the `test_wheel` CI
# job runs it against the built distribution so "not shipped" never means "not
# exercised". `CHANGELOG.md` and `CITATION.cff` are included because they are
# what a user reads after `pip download`.
[tool.hatch.build.targets.sdist]
include = [
    "/src/audiotree",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/LICENSE",
    "/LICENSES",
    "/README.md",
]

[tool.pytest.ini_options]
# Run docstring examples (``>>> ...``) alongside the unit tests so they can't
# rot. ``testpaths`` lets a bare ``pytest`` collect all three: doctests from
# ``src``, the unit suite from ``tests``, and the ``examples`` scripts. The
# examples are a user's first contact with the library; leaving them out of the
# default run let all three rot against renamed API without anything going red.
addopts = "--doctest-modules"
testpaths = ["src", "tests", "examples"]
markers = [
    "slow: doc checks that build Sphinx or execute snippets/examples end to end.",
]
filterwarnings = [
    # Text I/O without an explicit `encoding` follows the locale, which is UTF-8
    # on Linux and macOS but cp1252 on Windows -- so a manifest written on one
    # platform can be unreadable on another. Only emitted under
    # PYTHONWARNDEFAULTENCODING=1, which CI sets; harmless locally without it.
    "ignore::EncodingWarning",
    "error::EncodingWarning:audiotree",
    "error::EncodingWarning:tests",
    "ignore:.*aifc.*:DeprecationWarning:audioread.rawread",
    "ignore:.*audioop.*:DeprecationWarning:audioread.rawread",
    "ignore:.*sunau.*:DeprecationWarning:audioread.rawread",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Keep Ruff's defaults (E, F) and additionally reject PEP 484 implicit `Optional`
# (a `None` default on a non-`Optional`-typed parameter), e.g., `x: float = None`.
extend-select = ["RUF013"]
