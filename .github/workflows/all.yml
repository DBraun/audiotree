name: Python package

on:
  push:
    branches:
      - main
      - dev
  # No branch filter: every pull request runs CI, whatever it targets.
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v8.3.1
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install libsndfile (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get install libsndfile-dev

    - name: Install libsndfile (macOS)
      if: runner.os == 'macOS'
      run: brew install libsndfile

    # `bagz` publishes manylinux x86-64 wheels only, so the extra is installable
    # on the Linux runners and not the macOS ones. Installing it where we can
    # exercises the string-leaf and windowed-LUFS-cache paths instead of
    # skipping them; the macOS jobs prove the package works without it.
    - name: Install dependencies (Linux, with bagz)
      if: runner.os == 'Linux'
      run: uv sync --extra bagz

    - name: Install dependencies (macOS, no bagz)
      if: runner.os == 'macOS'
      run: uv sync

    - name: Run tests
      run: uv run pytest

  test_lowest_direct:
    # Resolve every declared dependency to its lowest allowed version and run
    # the suite. Without this, the floors in pyproject.toml are aspirational:
    # the normal job always installs the newest compatible release, so a floor
    # that is too low (or fictional) is never exercised.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv and Python
      uses: astral-sh/setup-uv@v8.3.1
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies (lowest allowed versions)
      run: |
        sudo apt-get install libsndfile-dev
        uv sync --extra bagz --resolution lowest-direct

    - name: Run tests
      run: uv run --no-sync pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.1
      with:
        python-version: "3.11"

    - name: Run pre-commit
      run: uvx pre-commit run --all-files

  build_docs:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv and Python
      uses: astral-sh/setup-uv@v8.3.1
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: |
        sudo apt-get install libsndfile-dev
        uv sync

    - name: Run doctests
      run: uv run make -C docs doctest

    - name: Build Docs
      run: uv run make -C docs html

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/build/html

  deploy_docs:
    # Deploy the built docs to GitHub Pages (requires Settings -> Pages ->
    # Source = "GitHub Actions"). Only on main; PRs build but don't deploy.
    needs: build_docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

  publish:
    needs: [test, test_lowest_direct, lint, build_docs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/audiotree

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.1
      with:
        python-version: "3.11"

    - name: Build package
      run: uv build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
