name: Python package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get install libsndfile-dev
        python -m pip install --upgrade pip
        pip install ".[dev]"
        pip install git+https://github.com/DBraun/argbind.git@dev

    - name: Run tests
      run: |
        python -m pytest

  test_grain_floor:
    # Guards the lower bound of `grain>=0.2.15`: transforms/core.py uses grain
    # internals that have moved across releases, so pin the floor and run the
    # full suite to keep the minimum supported version honest.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies (grain floor)
      run: |
        sudo apt-get install libsndfile-dev
        python -m pip install --upgrade pip
        pip install ".[dev]"
        pip install "grain==0.2.15"

    - name: Run tests
      run: |
        python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit
        pre-commit run --all-files

  build_docs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        sudo apt-get install libsndfile-dev
        python -m pip install --upgrade pip
        pip install ".[dev]"
        pip install git+https://github.com/DBraun/argbind.git@dev
        pip install furo

    - name: Build Docs
      run: |
        cd docs
        make html

    - name: Deploy Docs to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build/html

  publish:
    needs: [test, test_grain_floor, lint, build_docs]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
