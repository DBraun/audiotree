name: Python package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v8
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: |
        sudo apt-get install libsndfile-dev
        uv sync

    - name: Run tests
      run: uv run pytest

  test_grain_floor:
    # Guards the lower bound of `grain>=0.2.15`: transforms/core.py uses grain
    # internals that have moved across releases, so pin the floor and run the
    # full suite to keep the minimum supported version honest.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv and Python
      uses: astral-sh/setup-uv@v8
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies (grain floor)
      run: |
        sudo apt-get install libsndfile-dev
        uv sync
        # Pin grain to the declared floor in the synced env; the next step runs
        # with --no-sync so the pin sticks. Fails if the code needs newer grain.
        uv pip install "grain==0.2.15"

    - name: Run tests
      run: uv run --no-sync pytest

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v8
      with:
        python-version: "3.11"

    - name: Run pre-commit
      run: uvx pre-commit run --all-files

  build_docs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv and Python
      uses: astral-sh/setup-uv@v8
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: |
        sudo apt-get install libsndfile-dev
        uv sync

    - name: Run doctests
      run: uv run make -C docs doctest

    - name: Build Docs
      run: uv run make -C docs html

    - name: Deploy Docs to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build/html

  publish:
    needs: [test, test_grain_floor, lint, build_docs]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v8
      with:
        python-version: "3.11"

    - name: Build package
      run: uv build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
